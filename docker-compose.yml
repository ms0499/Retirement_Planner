services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-retirement}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retirement}
      POSTGRES_DB: ${POSTGRES_DB:-retirement}
    volumes:
      - retirement_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-retirement}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  retirement_postgres_data:
